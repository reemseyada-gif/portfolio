<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الصورة الموسعة والمختصرة</title>
<style>
:root{
  --bg:#fbf6ee; --paper:#ffffff; --ink:#2b2a33; --muted:#6d6a75; --line:#e2d8c8;
  --th:#7b4fc9; --th-soft:#f0e8fc;
  --h:#2b78cf;  --h-soft:#e3effc;
  --t:#23935f;  --t-soft:#ddf3e8;
  --o:#e07a1f;  --o-soft:#fdecd9;
  --ok:#23935f; --bad:#d23f3f;
  --cell:clamp(48px,18vw,84px);
  --bcell:clamp(24px,6.6vw,52px);
  --gap:12px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Tahoma,'Segoe UI','Geeza Pro','Noto Sans Arabic',Arial,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-size:1.7rem;margin:0;font-weight:800}
.hdr-side{display:flex;gap:8px;align-items:center}
.score{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;white-space:nowrap}
.icon-btn{border:1px solid var(--line);background:var(--paper);border-radius:999px;width:38px;height:38px;font-size:1.1rem;cursor:pointer}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;margin-bottom:14px}
.seg button{border:0;background:transparent;font:inherit;font-weight:700;font-size:.98rem;padding:7px 12px;border-radius:9px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
.prompt-label{color:var(--muted);font-weight:700;margin:0 0 4px;font-size:1.05rem}
.prompt{font-size:clamp(1.7rem,7.5vw,2.6rem);font-weight:800;margin:0;min-height:1.3em}
bdi.n{display:inline-block;direction:ltr}

/* ---- منطقة الإفلات ---- */
.stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 0}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;padding:14px 16px 16px;border-radius:18px;border:3px dashed transparent;transition:border-color .2s,background .2s;min-width:calc(var(--cell)*4 + 32px)}
.drop.over{border-color:var(--ink);background:#f6f1e8}
.cols{display:flex;direction:ltr;margin-bottom:4px}
.cols div{width:var(--cell);text-align:center;font-size:.85rem;font-weight:800}
.board{position:relative;width:calc(var(--cell)*4);height:calc(var(--cell)*1.12);transition:height .45s ease}
.slots{position:absolute;top:0;right:0;display:flex;direction:ltr;height:calc(var(--cell)*1.12)}
.slots div{width:var(--cell);height:100%;border:2px dashed var(--line);border-radius:10px;background:#fffdf9}
.empty-hint{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-weight:700;font-size:.95rem;pointer-events:none;text-align:center;padding:0 6px}
.board.solved .slots div{border-color:var(--ok)}

/* ---- البطاقة (نفس الشكل في البنك وعلى اللوحة) ---- */
.card{position:relative;height:calc(var(--cell)*1.12);display:flex;direction:ltr;border-radius:calc(var(--cell)*.16);touch-action:none;cursor:grab}
.card span{width:var(--cell);display:grid;place-items:center;font-size:calc(var(--cell)*.64);font-weight:800;line-height:1}
:root{--arrow:calc(var(--cell)*.22)}
.c-th{--c:var(--th)} .c-h{--c:var(--h)} .c-t{--c:var(--t)} .c-o{--c:var(--o)}
.card::after{content:"";position:absolute;right:calc(var(--cell)*-.2);top:50%;transform:translateY(-50%);width:calc(var(--cell)*.22);height:calc(var(--cell)*.48);background:var(--c);clip-path:polygon(0 0,100% 50%,0 100%)}
.board,.cols{margin-right:calc(var(--cell)*.2)}
.chips .card{margin-right:calc(var(--cell)*.2)}
.eslot{padding-right:calc(var(--ecell)*.3)!important}
.c-th{background:var(--th-soft);color:var(--th);box-shadow:inset 0 0 0 3px var(--th),0 3px 0 rgba(0,0,0,.08)}
.c-h {background:var(--h-soft); color:var(--h); box-shadow:inset 0 0 0 3px var(--h), 0 3px 0 rgba(0,0,0,.08)}
.c-t {background:var(--t-soft); color:var(--t); box-shadow:inset 0 0 0 3px var(--t), 0 3px 0 rgba(0,0,0,.08)}
.c-o {background:var(--o-soft); color:var(--o); box-shadow:inset 0 0 0 3px var(--o), 0 3px 0 rgba(0,0,0,.08)}
.board .card{position:absolute;top:0;right:0;transition:transform .5s cubic-bezier(.3,1.25,.5,1),opacity .2s}
.board .card.hidden{opacity:0;pointer-events:none}
.board .card.lifted{opacity:.25}
.board .card.plus::before{content:"+";position:absolute;left:calc(var(--cell)*-0.55);top:50%;transform:translateY(-50%);font-size:calc(var(--cell)*.5);font-weight:800;color:var(--muted)}
.board .card.pop{animation:pop .3s ease}
@keyframes pop{0%{opacity:.4;margin-top:-14px}100%{opacity:1;margin-top:0}}
.board .card.wrong{animation:shake .45s ease}
.board .card.wrong span{color:var(--bad)}
@keyframes shake{0%,100%{margin-right:0}20%{margin-right:-8px}40%{margin-right:8px}60%{margin-right:-5px}80%{margin-right:5px}}
.ghost{position:fixed;z-index:1000;pointer-events:none;transform:rotate(-3deg) scale(1.04);filter:drop-shadow(0 12px 16px rgba(0,0,0,.25));opacity:.95}

.readout{min-height:1.6em;font-size:1.15rem;font-weight:700;text-align:center;margin-top:10px}
.msg{min-height:1.5em;text-align:center;font-weight:800;font-size:1.15rem;margin:4px 0 0}
.readout:empty,.msg:empty{display:none}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.btn{font:inherit;font-weight:800;font-size:1.05rem;border-radius:12px;padding:10px 18px;cursor:pointer;border:2px solid var(--ink);background:var(--paper);color:var(--ink)}
.btn.primary{background:var(--ink);color:#fff}
.btn:disabled{opacity:.4;cursor:default}

/* ---- البنك ---- */
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{flex:1;min-width:64px;font:inherit;font-weight:800;font-size:1.05rem;padding:9px 6px;border-radius:12px;cursor:pointer;border:2px solid var(--c);color:var(--c);background:var(--paper)}
.tabs button[aria-pressed="true"]{background:var(--c);color:#fff}
.tabs .t-th{--c:var(--th)} .tabs .t-h{--c:var(--h)} .tabs .t-t{--c:var(--t)} .tabs .t-o{--c:var(--o)}
.tabs{display:none!important}
/* البطاقات في أربعة أعمدة كجدول المنازل: الآلاف يسارًا والآحاد يمينًا */
#bank{display:flex;direction:ltr;justify-content:center;align-items:flex-start;gap:calc(var(--bcell)*.5)}
.bank-row{margin:0;display:flex;flex-direction:column;align-items:flex-end}
.bank-label{display:block;align-self:center;font-size:1rem;margin-bottom:8px}
.chips{flex-direction:column;align-items:flex-end;flex-wrap:nowrap;gap:calc(var(--bcell)*.22)}
.bank-row{margin-bottom:14px}
.bank-label{font-weight:800;font-size:1rem;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .card{--cell:var(--bcell)}
.chips .card.used{opacity:.3}
.lbl-th{color:var(--th)} .lbl-h{color:var(--h)} .lbl-t{color:var(--t)} .lbl-o{color:var(--o)}
.hint{color:var(--muted);font-size:.92rem;margin:4px 0 0}

.star{position:absolute;top:45%;left:50%;font-size:1.6rem;pointer-events:none;animation:burst .9s ease-out forwards}
@keyframes burst{from{transform:translate(-50%,-50%) scale(.4);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.1);opacity:0}}
/* خانات الصورة الموسعة */
:root{--ecell:clamp(22px,7.2vw,52px)}
.hide{display:none!important}
.expand{display:flex;direction:rtl;align-items:center;justify-content:center;gap:6px;padding:6px 0 4px;max-width:100%}
.eslot{--cell:var(--ecell);min-width:calc(var(--ecell)*2.4);height:calc(var(--ecell)*1.12 + 8px);padding:3px;border:2px dashed var(--line);border-radius:10px;display:flex;justify-content:center;align-items:center;background:#fffdf9;transition:border-color .2s,background .2s}
.eslot,.eslot .card{flex-shrink:0}
.eslot.over{border-color:var(--ink);background:#f6f1e8}
.eslot.wrong{border-color:var(--bad);background:#fdeaea}
.eslot .card.lifted{opacity:.25}
.eplus{font-weight:800;font-size:calc(var(--ecell)*.75);color:var(--muted)}
/* لوحة الإفلات تبقى ظاهرة أعلى الشاشة أثناء التمرير إلى البطاقات */
.panel.sticky{position:sticky;top:0;z-index:50;box-shadow:0 8px 18px rgba(0,0,0,.08);padding:12px 14px}
.drop-title{margin:2px 0 4px;font-weight:800;font-size:1rem;color:var(--muted);text-align:center}
@media (max-width:520px){
  :root{--cell:clamp(42px,15vw,70px);--bcell:clamp(22px,6.6vw,40px)}
  h1{font-size:1.35rem}
  .prompt{font-size:1.6rem}
  .prompt-label{font-size:.95rem}
  .drop{padding:8px 8px 10px;min-width:calc(var(--cell)*4 + 20px)}
  .readout,.msg{font-size:1rem;margin-top:4px}
  .actions{margin-top:6px;gap:6px}
  .btn{font-size:.88rem;padding:7px 9px;border-width:2px}
  .actions{flex-wrap:nowrap}
  :root{--ecell:clamp(18px,6vw,30px)}
  .expand{gap:4px}
  .panel.sticky{border-radius:0 0 18px 18px;margin-left:-16px;margin-right:-16px;border-top:0}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>الصورة الموسعة والمختصرة</h1>
    <div class="hdr-side">
      <div class="score" id="score">⭐ ٠</div>
      <button class="icon-btn" id="sound" aria-label="الصوت">🔊</button>
      <button class="icon-btn" id="fs" aria-label="ملء الشاشة" title="ملء الشاشة">⛶</button>
    </div>
  </header>

  <div class="seg" id="modeSeg" role="group" aria-label="نوع النشاط">
    <button data-mode="build" aria-pressed="true">من الموسعة إلى العدد</button>
    <button data-mode="analyze">من العدد إلى الموسعة</button>
    <button data-mode="free">تمرين حر</button>
  </div>

  <section class="panel sticky">
    <p class="prompt-label" id="promptLabel"></p>
    <p class="prompt" id="prompt"></p>

    <div class="stage" id="stage">
      <p class="drop-title" id="dropTitle">اسحب البطاقات وأفلتها هنا ⬇</p>
      <div class="expand hide" id="expand"></div>
      <div class="drop" id="drop">
        <div class="cols">
          <div class="lbl-th">آلاف</div><div class="lbl-h">مئات</div><div class="lbl-t">عشرات</div><div class="lbl-o">آحاد</div>
        </div>
        <div class="board" id="board">
          <div class="slots"><div></div><div></div><div></div><div></div></div>
        </div>
      </div>
      <div class="readout" id="readout"></div>
      <p class="msg" id="msg"></p>
    </div>

    <div class="actions">
      <button class="btn primary" id="checkBtn">تحقّق</button>
      <button class="btn" id="splitBtn">افصل البطاقات</button>
      <button class="btn" id="clearBtn">مسح</button>
      <button class="btn" id="nextBtn">التالي ←</button>
    </div>
  </section>

  <section class="panel bank">
    <div class="tabs" id="tabs">
      <button class="t-th" data-p="3" aria-pressed="true">آلاف</button>
      <button class="t-h" data-p="2" aria-pressed="false">مئات</button>
      <button class="t-t" data-p="1" aria-pressed="false">عشرات</button>
      <button class="t-o" data-p="0" aria-pressed="false">آحاد</button>
    </div>
    <div id="bank"></div>
    <p class="hint">اسحب البطاقة إلى مكانها في الأعلى. لإرجاع بطاقة، اسحبها إلى الخارج.</p>
  </section>
</div>

<script>
const AR = '٠١٢٣٤٥٦٧٨٩';
const ar = n => String(n).replace(/\d/g, d => AR[d]);
const PLACES = [
  {p:3, name:'الآلاف',  c:'th'},
  {p:2, name:'المئات',  c:'h'},
  {p:1, name:'العشرات', c:'t'},
  {p:0, name:'الآحاد',  c:'o'}
];
const clsOf = p => PLACES[3-p].c;
const st = {mode:'build', placed:[0,0,0,0], tDigits:[0,0,0,0], target:0,
            slots:[], wrongSlots:[], solved:false, split:false, right:0, tries:0, sound:true};
const $ = id => document.getElementById(id);
const cardEls = {};
st.tab = 3;

const valueOf = d => d[0] + d[1]*10 + d[2]*100 + d[3]*1000;
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
function expanded(d){
  const parts = [];
  for (let p = 3; p >= 0; p--) if (d[p]) parts.push(ar(d[p] * 10**p));
  return parts.join(' + ');
}
const expectedPlaces = () => [3,2,1,0].filter(p => st.tDigits[p]);
function newTarget(){
  const d = [rnd(1,9), rnd(1,9), rnd(1,9), rnd(1,9)];
  if (Math.random() < .35) d[rnd(1,2)] = 0;   // صفر في المئات أو العشرات
  if (Math.random() < .15) d[0] = 0;           // صفر في الآحاد
  st.tDigits = d; st.target = valueOf(d);
  st.slots = expectedPlaces().map(() => null);
}
function cardHTML(p, d){
  return [d, ...Array(p).fill(0)].map(x => `<span>${ar(x)}</span>`).join('');
}

/* ---------- صوت ---------- */
let actx;
function tone(freqs){
  if (!st.sound) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f,i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = f; const t = actx.currentTime + i*0.12;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.2, t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.25);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+0.3);
    });
  }catch(e){}
}

/* ---------- بناء الواجهة ---------- */
function buildBank(){
  const bank = $('bank');
  PLACES.forEach(P => {
    const row = document.createElement('div'); row.className = 'bank-row';
    row.innerHTML = `<div class="bank-label lbl-${P.c}">${P.name}</div>`;
    const chips = document.createElement('div'); chips.className = 'chips';
    for (let d = 1; d <= 9; d++){
      const c = document.createElement('div');
      c.className = `card c-${P.c}`; c.dataset.p = P.p; c.dataset.d = d;
      c.innerHTML = cardHTML(P.p, d);
      c.addEventListener('pointerdown', e => startDrag(e, P.p, d, null));
      chips.appendChild(c);
    }
    row.dataset.p = P.p;
    row.appendChild(chips); bank.appendChild(row);
  });
}
function buildBoard(){
  PLACES.forEach(P => {
    const el = document.createElement('div');
    el.className = `card c-${P.c} hidden`;
    el.style.zIndex = 10 - P.p;                // الآحاد في الأعلى
    el.addEventListener('pointerdown', e => {
      if (st.placed[P.p] && st.mode !== 'analyze') startDrag(e, P.p, st.placed[P.p], {board:true, el});
    });
    $('board').appendChild(el);
    cardEls[P.p] = el;
  });
}
function renderExpand(){
  const ex = $('expand'); ex.innerHTML = '';
  st.slots.forEach((s, i) => {
    if (i){ const pl = document.createElement('span'); pl.className = 'eplus'; pl.textContent = '+'; ex.appendChild(pl); }
    const sl = document.createElement('div'); sl.className = 'eslot'; sl.dataset.i = i;
    if (st.wrongSlots.includes(i)) sl.classList.add('wrong');
    if (s){
      const c = document.createElement('div');
      c.className = `card c-${clsOf(s.p)}`; c.innerHTML = cardHTML(s.p, s.d);
      c.addEventListener('pointerdown', e => startDrag(e, s.p, s.d, {slot:i, el:c}));
      sl.appendChild(c);
    }
    ex.appendChild(sl);
  });
}

/* ---------- السحب والإفلات ---------- */
let drag = null;
function startDrag(e, p, d, src){
  if (st.solved || e.button > 0) return;
  e.preventDefault();
  const ghost = document.createElement('div');
  ghost.className = `card ghost c-${clsOf(p)}`;
  if (st.mode === 'analyze') ghost.style.setProperty('--cell', 'var(--ecell)');
  ghost.innerHTML = cardHTML(p, d);
  document.body.appendChild(ghost);
  const r = ghost.getBoundingClientRect();
  drag = {p, d, ghost, src, w:r.width, h:r.height, x0:e.clientX, y0:e.clientY, moved:false};
  if (src) src.el.classList.add('lifted');
  moveGhost(e);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
}
function moveGhost(e){
  drag.ghost.style.left = (e.clientX - drag.w/2) + 'px';
  drag.ghost.style.top  = (e.clientY - drag.h/2) + 'px';
}
function overDrop(e){
  const r = $('drop').getBoundingClientRect();
  return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
}
function slotAt(e){
  const el = document.elementFromPoint(e.clientX, e.clientY);
  return el ? el.closest('.eslot') : null;
}
function onMove(e){
  if (!drag) return;
  if (Math.abs(e.clientX-drag.x0) + Math.abs(e.clientY-drag.y0) > 6) drag.moved = true;
  moveGhost(e);
  if (st.mode === 'analyze'){
    const sl = slotAt(e);
    document.querySelectorAll('.eslot').forEach(x => x.classList.toggle('over', x === sl));
  } else {
    $('drop').classList.toggle('over', overDrop(e));
  }
}
function onUp(e){
  window.removeEventListener('pointermove', onMove);
  window.removeEventListener('pointerup', onUp);
  window.removeEventListener('pointercancel', onUp);
  if (!drag) return;
  const {p, d, ghost, src, moved} = drag;
  drag = null;
  ghost.remove();
  if (src) src.el.classList.remove('lifted');
  $('drop').classList.remove('over');
  clearMarks();

  if (st.mode === 'analyze'){
    const sl = slotAt(e);
    if (src && src.slot != null){                       // من خانة
      if (sl){
        const j = +sl.dataset.i;
        if (j !== src.slot){ [st.slots[j], st.slots[src.slot]] = [st.slots[src.slot], st.slots[j]]; tone([560]); }
      } else if (moved){ st.slots[src.slot] = null; tone([330]); }
    } else if (sl){                                      // من البنك
      st.slots = st.slots.map(s => (s && s.p === p && s.d === d) ? null : s);
      st.slots[+sl.dataset.i] = {p, d}; tone([520 + p*90]); advanceTab(p);
    }
    render(); return;
  }

  if (src && src.board){
    if (!overDrop(e) && moved){ st.placed[p] = 0; tone([330]); }   // سُحبت إلى الخارج
    render();
  } else if (overDrop(e)){
    st.placed[p] = d; tone([520 + p*90]); advanceTab(p); render(p);
  } else render();
}

/* ---------- التحقق ---------- */
function clearMarks(){
  Object.values(cardEls).forEach(e => e.classList.remove('wrong'));
  st.wrongSlots = [];
  if (!st.solved) setMsg('', '');
}
function setMsg(t, cls){ const m = $('msg'); m.textContent = t; m.className = 'msg ' + (cls||''); }

function success(){
  st.right++; st.solved = true; st.split = false;
  setMsg(['أحسنت! 🌟','ممتاز! 👏','رائع جدًا! 🎉','عمل جميل! ⭐'][rnd(0,3)], 'ok');
  tone([660, 830, 990]); celebrate();
}

function check(){
  if (st.mode === 'free') return;
  if (st.solved) return next();

  if (st.mode === 'analyze'){
    if (st.slots.some(s => !s)) { setMsg('املأ كل الخانات بالبطاقات', 'bad'); return; }
    st.tries++;
    const exp = expectedPlaces();
    const wrong = [];
    st.slots.forEach((s, i) => { if (s.p !== exp[i] || s.d !== st.tDigits[exp[i]]) wrong.push(i); });
    if (!wrong.length){
      success();
      st.placed = [...st.tDigits];          // تتراكب البطاقات لتُظهر أنها تكوّن العدد
    } else {
      st.wrongSlots = wrong;
      const allRight = st.slots.every(s => st.tDigits[s.p] === s.d);
      setMsg(allRight ? 'البطاقات صحيحة، رتّبها من الأكبر إلى الأصغر' : 'راجع البطاقات في الخانات الحمراء', 'bad');
      tone([300, 220]);
    }
    render(); return;
  }

  if (!st.placed.some(Boolean)) { setMsg('اسحب البطاقات أولًا', 'bad'); return; }
  st.tries++;
  const wrong = PLACES.filter(P => st.placed[P.p] !== st.tDigits[P.p]);
  if (!wrong.length){
    success();
  } else {
    const W = wrong[0];
    let tip = `راجع منزلة ${W.name}`;
    if (st.tDigits[W.p] === 0 && st.placed[W.p]) tip += ' — هذه المنزلة صفر، لا تحتاج بطاقة';
    else if (!st.placed[W.p]) tip += ' — تحتاج بطاقة هنا';
    setMsg(tip, 'bad');
    wrong.forEach(P => { const e = cardEls[P.p]; if (st.placed[P.p]) { void e.offsetWidth; e.classList.add('wrong'); } });
    tone([300, 220]);
  }
  render();
}
function advanceTab(p){ if (p > 0) st.tab = p - 1; }
function next(){
  st.tab = 3;
  st.placed = [0,0,0,0]; st.solved = false; st.split = false;
  newTarget();
  clearMarks(); render();
}
function celebrate(){
  const colors = ['#7b4fc9','#2b78cf','#23935f','#e07a1f','#f2b705'];
  for (let i = 0; i < 18; i++){
    const s = document.createElement('span'); s.className = 'star'; s.textContent = '★';
    const a = Math.random()*Math.PI*2, r = 90 + Math.random()*90;
    s.style.setProperty('--dx', Math.cos(a)*r + 'px');
    s.style.setProperty('--dy', Math.sin(a)*r + 'px');
    s.style.color = colors[i % colors.length];
    $('stage').appendChild(s); setTimeout(() => s.remove(), 950);
  }
}

/* ---------- العرض ---------- */
function render(popP = null){
  const A = st.mode === 'analyze';
  const t = {
    build:   ['كوّن العدد من صورته الموسعة:', `<bdi class="n">${expanded(st.tDigits)}</bdi>`],
    analyze: ['اكتب الصورة الموسعة للعدد بالبطاقات:', `<bdi class="n">${ar(st.target)}</bdi>`],
    free:    ['تمرين حر — ركّب أي عدد وشاهد صورته الموسعة', '']
  }[st.mode];
  $('promptLabel').textContent = t[0];
  $('prompt').innerHTML = t[1];
  $('dropTitle').textContent = A
    ? (st.solved ? 'وعند تركيب البطاقات فوق بعضها يتكوّن العدد:' : 'اسحب كل بطاقة إلى خانة ⬇')
    : 'اسحب البطاقات وأفلتها هنا ⬇';

  // خانات الصورة الموسعة
  $('expand').classList.toggle('hide', !A || st.solved);
  if (A) renderExpand();
  $('drop').classList.toggle('hide', A && !st.solved);

  // لوحة التراكب
  const present = PLACES.filter(P => st.placed[P.p]);
  PLACES.forEach(P => {
    const el = cardEls[P.p], d = st.placed[P.p];
    if (d){
      el.innerHTML = cardHTML(P.p, d);
      el.classList.remove('hidden');
      const i = present.indexOf(P);
      el.style.transform = st.split ? `translateY(calc((var(--cell)*1.12 + var(--gap)) * ${i}))` : 'translateY(0)';
      el.classList.toggle('plus', st.split && i > 0);
      if (popP === P.p){ el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
    } else {
      el.classList.add('hidden'); el.classList.remove('plus');
    }
  });
  const rows = st.split ? Math.max(present.length, 1) : 1;
  $('board').style.height = `calc(var(--cell)*1.12*${rows} + var(--gap)*${rows-1})`;
  $('board').classList.toggle('solved', st.solved);

  // البطاقات المستخدمة في البنك
  document.querySelectorAll('.chips .card').forEach(c => {
    const p = +c.dataset.p, d = +c.dataset.d;
    const used = A ? st.slots.some(s => s && s.p === p && s.d === d) : st.placed[p] === d;
    c.classList.toggle('used', used);
  });

  const val = valueOf(st.placed);
  let ro = '';
  if (st.mode === 'free' && val) ro = `العدد: <bdi class="n">${ar(val)}</bdi> &nbsp;=&nbsp; <bdi class="n">${expanded(st.placed)}</bdi>`;
  else if (st.solved && st.mode === 'build') ro = `العدد هو <bdi class="n">${ar(st.target)}</bdi>`;
  else if (st.solved && A) ro = `<bdi class="n">${ar(st.target)} = ${expanded(st.tDigits)}</bdi>`;
  $('readout').innerHTML = ro;

  $('splitBtn').textContent = st.split ? 'اجمع البطاقات' : 'افصل البطاقات';
  $('splitBtn').classList.toggle('hide', A && !st.solved);
  $('splitBtn').disabled = present.length < 2;
  $('checkBtn').style.display = st.mode === 'free' ? 'none' : '';
  $('checkBtn').textContent = st.solved ? 'سؤال جديد' : 'تحقّق';
  $('nextBtn').classList.toggle('hide', st.solved);
  $('clearBtn').classList.toggle('hide', st.solved);
  $('nextBtn').textContent = st.mode === 'free' ? 'ابدأ من جديد' : 'التالي ←';
  $('score').textContent = `⭐ ${ar(st.right)}`;
  $('score').title = `${ar(st.right)} صحيحة من ${ar(st.tries)} محاولة`;
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.p === st.tab)));
}

/* ---------- الأزرار ---------- */
$('modeSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  st.mode = b.dataset.mode;
  $('modeSeg').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  next();
};
$('checkBtn').onclick = check;
$('nextBtn').onclick = next;
$('clearBtn').onclick = () => {
  if (st.solved) return;
  st.placed = [0,0,0,0]; st.slots = st.slots.map(() => null); st.split = false;
  clearMarks(); render();
};
$('splitBtn').onclick = () => { st.split = !st.split; render(); };
$('sound').onclick = () => { st.sound = !st.sound; $('sound').textContent = st.sound ? '🔊' : '🔇'; };

$('tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; st.tab = +b.dataset.p; render(); };
const fsEl = document.documentElement;
const fsReq = fsEl.requestFullscreen || fsEl.webkitRequestFullscreen;
if (!fsReq) $('fs').classList.add('hide');
$('fs').onclick = () => {
  const on = document.fullscreenElement || document.webkitFullscreenElement;
  try{
    if (on) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else fsReq.call(fsEl);
  }catch(e){}
};

buildBank(); buildBoard(); newTarget(); render();
</script>
</body>
