<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="لعبة تعليمية تفاعلية للصف الأول: الأعداد ١ و٢ و٣. إعداد أ. ريم">
<meta property="og:title" content="أعدادي الأولى ١ ٢ ٣">
<meta property="og:description" content="ثلاث ألعاب تفاعلية للصف الأول: عُدّ وفرقع، البطاقات القلّابة، السلة والقلم. إعداد أ. ريم">
<meta property="og:type" content="website">
<meta name="author" content="أ. ريم">
<title>أعدادي الأولى</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;800&display=swap">
<style>
/* Layout: moving-train sky band on top, one play card below; one screen at a time. Single daytime look by design. */
:root{
  --bg:#F4F6F0;
  --card:#FFFFFF;
  --ink:#2A3F4A;
  --muted:#60777E;
  --line:#DAE4DF;
  --mint:#A6D8BD; --mint-d:#3F8F6A;
  --coral:#F4A893; --coral-d:#C9604A;
  --butter:#F8E09A; --butter-d:#B88A1C;
  --lav:#C9BCEB; --lav-d:#6E5BAE;
  --sky:#AFDAEC; --sky-d:#3C86A6;
  --font:"Baloo Bhaijaan 2","Tajawal","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font);font-size:19px;line-height:1.6}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky-d);outline-offset:3px;border-radius:12px}

/* ---------- sky band ---------- */
.scene{position:relative;overflow:hidden;background:var(--sky);height:clamp(150px,22vw,210px);border-bottom:4px solid var(--mint)}
.scene svg.sky{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer}
.rays{transform-box:fill-box;transform-origin:center;animation:spin 18s linear infinite}
.cloud{animation:drift linear infinite}
.c1{animation-duration:50s}.c2{animation-duration:64s;animation-delay:-28s}
.train{animation:trainRun 22s linear infinite}
.train.toot{animation-duration:9s}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin 1s linear infinite}
.puff{animation:puff 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
.puff.p2{animation-delay:.5s}.puff.p3{animation-delay:1s}
.bfly{animation:flutter 7s ease-in-out infinite}
.bwing{transform-box:fill-box;transform-origin:50% 100%;animation:flap .25s ease-in-out infinite alternate}
.chick{cursor:pointer}
.chick-body{transform-box:fill-box;transform-origin:50% 100%}
.chick.hop .chick-body{animation:hop .8s ease}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
.cwing{transform-box:fill-box;transform-origin:80% 30%;animation:wave 1.6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(1200px)}}
@keyframes trainRun{from{transform:translateX(1050px)}to{transform:translateX(-480px)}}
@keyframes puff{from{transform:translate(0,0) scale(.4);opacity:.9}to{transform:translate(18px,-34px) scale(1.4);opacity:0}}
@keyframes flutter{0%{transform:translate(520px,70px)}25%{transform:translate(600px,40px)}50%{transform:translate(690px,80px)}75%{transform:translate(600px,100px)}100%{transform:translate(520px,70px)}}
@keyframes flap{to{transform:scaleY(.3)}}
@keyframes hop{25%{transform:translateY(-30px) rotate(-8deg)}50%{transform:translateY(0)}70%{transform:translateY(-12px) rotate(6deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
@keyframes wave{50%{transform:rotate(-25deg)}}

.hud{position:absolute;top:10px;inset-inline:max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:flex-start;pointer-events:none}
.chip{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.88);border:2px solid var(--card);border-radius:999px;padding:2px 12px;cursor:pointer;box-shadow:0 3px 0 rgba(42,63,74,.12)}
.chip svg{width:24px;height:24px}
.bubble{position:absolute;top:12px;right:clamp(96px,16vw,190px);max-width:min(300px,54vw);background:var(--card);color:var(--ink);border:3px solid var(--butter);border-radius:20px 20px 4px 20px;padding:6px 14px;font-weight:600;font-size:16px;line-height:1.45;box-shadow:0 4px 0 rgba(42,63,74,.1);transform-origin:100% 100%;animation:pop .35s ease}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.sky-pop{position:absolute;pointer-events:none;display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.9);border:2px solid var(--butter);border-radius:999px;padding:0 12px;font-weight:800;font-size:24px;color:var(--ink);animation:floatAway 2.2s ease-out forwards}
.sky-pop i{width:12px;height:12px;border-radius:50%;background:var(--coral);display:inline-block}
@keyframes floatAway{to{transform:translateY(-70px) scale(1.15);opacity:0}}

/* ---------- page ---------- */
.wrap{max-width:960px;margin:0 auto;padding-block:20px 30px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{background:var(--card);border-radius:28px;padding:clamp(18px,4vw,34px);box-shadow:0 6px 0 var(--line)}
h1,h2,h3{line-height:1.25;text-wrap:balance;margin:0}
h1{font-size:clamp(32px,6.5vw,48px);font-weight:800}
h2{font-size:clamp(24px,4.4vw,34px);font-weight:800}
h3{font-size:22px;font-weight:800}
p{margin:0}
.lead{color:var(--muted);font-size:19px;max-width:58ch}
.btn{cursor:pointer;border:0;border-radius:18px;padding:10px 26px;font-size:20px;font-weight:800;background:var(--mint-d);color:#fff;box-shadow:0 5px 0 #2C6A4D;transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #2C6A4D}
.btn.alt{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.btn.soft{background:var(--butter);color:var(--ink);box-shadow:0 5px 0 var(--butter-d)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--sky-d);font-size:16px;font-weight:600;cursor:pointer;text-decoration:underline}

.welcome{display:grid;gap:20px;text-align:center;justify-items:center}
.hero-nums{display:flex;gap:clamp(10px,3vw,24px);justify-content:center}
.hero-nums span{display:grid;place-items:center;width:clamp(70px,16vw,104px);aspect-ratio:1;border-radius:26px;font-size:clamp(46px,11vw,72px);font-weight:800;line-height:1;animation:bounce 2.4s ease-in-out infinite}
.hero-nums span:nth-child(1){background:#FCE3DA;color:var(--coral-d)}
.hero-nums span:nth-child(2){background:#E3F3EA;color:var(--mint-d);animation-delay:.25s}
.hero-nums span:nth-child(3){background:#ECE6FA;color:var(--lav-d);animation-delay:.5s}
@keyframes bounce{50%{transform:translateY(-10px)}}
.name-row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;width:100%}
.name-row label{width:100%;font-size:22px;font-weight:800}
#kidName{font-family:inherit;font-size:24px;font-weight:600;padding:8px 18px;border-radius:18px;border:3px solid var(--line);width:min(340px,100%);text-align:center;color:var(--ink);background:var(--bg)}
#kidName:focus{border-color:var(--butter-d);outline:none}
.err{color:var(--coral-d);font-weight:600;width:100%}
.goals{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.goal{background:var(--bg);border:2px dashed var(--line);border-radius:14px;padding:4px 14px;font-size:16px;color:var(--muted)}

.menu-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;margin-bottom:20px}
.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:760px){.games{grid-template-columns:1fr}}
.game-card{cursor:pointer;text-align:start;border:3px solid var(--line);border-radius:24px;background:var(--card);padding:16px;display:grid;gap:8px;align-content:start;transition:transform .15s,border-color .15s}
.game-card:hover{transform:translateY(-4px);border-color:var(--butter-d)}
.game-card .art{height:120px;border-radius:16px;display:grid;place-items:center;overflow:hidden}
.game-card .art svg{height:100%;width:auto;max-width:100%}
.game-card .tag{font-size:15px;color:var(--muted)}
.stars{display:flex;gap:4px}
.stars svg{width:26px;height:26px}
.cert{margin-top:22px;border:4px double var(--butter-d);background:#FFF9E6;border-radius:24px;padding:22px;text-align:center;display:grid;gap:6px}
.cert .who{font-size:clamp(28px,6vw,40px);font-weight:800;color:var(--lav-d)}

.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:16px}
.topbar h2{flex:1;min-width:0;font-size:clamp(22px,4vw,30px)}
.back{cursor:pointer;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:4px 14px;font-size:17px;font-weight:600}
.progress{width:100%;display:flex;align-items:center;gap:12px;font-size:16px;color:var(--muted)}
.bar{flex:1;height:12px;background:var(--bg);border-radius:999px;overflow:hidden;border:2px solid var(--line)}
.bar i{display:block;height:100%;background:var(--mint);border-radius:999px;transition:width .4s}
.prompt{background:var(--bg);border-radius:22px;padding:14px 18px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:center;text-align:center;min-height:96px}
.prompt .q{font-size:17px;color:var(--muted);width:100%}
.prompt .big{font-size:clamp(46px,10vw,72px);font-weight:800;line-height:1.1;color:var(--lav-d)}
.prompt .word{font-size:clamp(34px,7vw,50px);font-weight:800;color:var(--coral-d)}
.speak{cursor:pointer;border:0;background:var(--butter);border-radius:50%;width:48px;height:48px;display:grid;place-items:center;box-shadow:0 3px 0 var(--butter-d)}
.speak svg{width:26px;height:26px}
.items{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.items svg{width:clamp(64px,15vw,90px);height:auto;animation:bounce 2s ease-in-out infinite}
.items svg:nth-child(2){animation-delay:.3s}.items svg:nth-child(3){animation-delay:.6s}

/* balloons (standing) */
.sky-play{display:flex;justify-content:space-around;align-items:flex-end;gap:8px;min-height:240px;padding:26px 10px 14px;margin-top:14px;border-radius:24px;overflow:hidden;background:linear-gradient(#D7EEF6,#F0F8F3)}
.balloon{position:relative;width:28%;max-width:150px;border:0;background:none;padding:0;cursor:pointer}
.balloon .sway{display:block;animation:sway 3s ease-in-out infinite}
.balloon svg{width:100%;height:auto;display:block;overflow:visible}
.balloon .num{position:absolute;top:18%;inset-inline:0;text-align:center;font-weight:800;font-size:clamp(40px,9vw,60px);color:var(--ink);line-height:1.2}
.balloon:hover svg{filter:brightness(1.06)}
.balloon.popped{pointer-events:none}
.balloon.popped .sway{animation:burst .45s ease forwards}
.balloon.wrong .sway{animation:shake .5s}
.balloon.faded{opacity:.35;pointer-events:none}
@keyframes sway{50%{transform:translateY(-6px) rotate(2deg)}}
@keyframes burst{40%{transform:scale(1.3)}to{transform:scale(0);opacity:0}}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}

/* triple flip cards */
.memo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;max-width:540px;margin:0 auto}
.fcard{perspective:900px;border:0;background:none;padding:0;cursor:pointer;aspect-ratio:1;max-width:100%}
.fcard .in{position:relative;display:block;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fcard.open .in,.fcard.done .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:18px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:6px;text-align:center}
.face.back{background:var(--butter);border:3px solid var(--card);box-shadow:0 4px 0 var(--butter-d)}
.face.back svg{width:56%;height:auto}
.face.front{transform:rotateY(180deg);border:3px solid var(--line);background:var(--card)}
.face.front.n{background:#EAF6EF;border-color:var(--mint)}
.face.front.w{background:#F1EDFB;border-color:var(--lav)}
.face.front.p{background:#FDEEE8;border-color:var(--coral)}
.face.front .val{font-weight:800;font-size:clamp(44px,11vw,64px);line-height:1}
.face.front .wd{font-weight:800;font-size:clamp(22px,5vw,30px)}
.face.front .pics{display:flex;flex-wrap:wrap;justify-content:center;gap:2px}
.face.front .pics svg{width:clamp(28px,7vw,40px);height:auto}
.fcard.done .face.front{box-shadow:0 0 0 4px var(--butter)}
.fcard.bad .in{animation:shake .5s}
.found{display:flex;gap:10px;justify-content:center;margin:12px 0}
.found span{width:44px;height:44px;border-radius:14px;border:3px dashed var(--line);display:grid;place-items:center;font-weight:800;font-size:26px;color:var(--muted)}
.found span.on{border-style:solid;border-color:var(--mint-d);background:#E3F4EA;color:var(--ink)}

/* basket */
.orchard{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:end;margin-top:14px}
@media (max-width:560px){.orchard{grid-template-columns:1fr}}
.tree{position:relative;background:#E8F4EC;border-radius:24px;padding:14px;min-height:190px}
.tree .apples{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.fruit{touch-action:none;user-select:none;cursor:grab;border:0;background:none;padding:0;width:62px;height:62px}
.fruit svg{width:100%;height:100%}
.basket{position:relative;min-height:190px;border-radius:24px;border:4px dashed var(--butter-d);background:#FFF8E4;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:10px}
.basket .inside{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;min-height:70px}
.basket .inside button{border:0;background:none;padding:0;width:52px;height:52px;cursor:pointer}
.basket .inside svg{width:100%;height:100%}
.basket .label{font-weight:800;color:var(--butter-d);font-size:17px}
.basket .weave{width:min(220px,90%);height:auto}

/* tracing */
.trace-wrap{display:grid;justify-items:center;gap:12px;margin-top:14px}
.board{position:relative;width:min(280px,82vw);aspect-ratio:26/30;border-radius:26px;background:#2F5D50;box-shadow:inset 0 0 0 10px #8B6A4E,0 6px 0 var(--line);overflow:hidden;touch-action:none}
.board canvas{position:absolute;inset:0;width:100%;height:100%}
.pencil{position:absolute;width:40px;height:40px;pointer-events:none;transition:none}

.dropbox{margin:16px auto 4px;width:min(260px,100%);min-height:110px;border:4px dashed var(--mint-d);border-radius:24px;display:grid;place-items:center;color:var(--muted);font-size:18px;font-weight:600;background:var(--card)}
.bank{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:14px}
.tile{touch-action:none;user-select:none;cursor:grab;border:0;border-radius:18px;width:78px;height:84px;font-size:52px;font-weight:800;background:var(--sky);box-shadow:0 5px 0 var(--sky-d);line-height:1}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:scale(1.12) rotate(-4deg);opacity:.92}
.over{background:#FFF1C9 !important;border-color:var(--butter-d) !important}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:16px}
.hint{text-align:center;color:var(--muted);font-size:16px;margin-top:6px}

.overlay{position:fixed;inset:0;z-index:40;background:rgba(42,63,74,.45);display:grid;place-items:center;padding:16px}
.result{background:var(--card);border-radius:28px;padding:26px;text-align:center;display:grid;gap:12px;width:min(420px,100%);animation:pop .4s ease}
.result .stars{justify-content:center}
.result .stars svg{width:52px;height:52px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60;width:100%;height:100%}

.credit{display:flex;justify-content:center;align-items:center;gap:12px;padding-block:4px 30px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.credit .by{color:var(--muted);font-size:18px;font-weight:600}
.credit .name{display:inline-block;font-size:clamp(30px,6vw,42px);font-weight:800;line-height:1.3;background:linear-gradient(90deg,var(--lav-d),var(--coral-d),var(--mint-d),var(--sky-d),var(--lav-d));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shine 6s linear infinite,nameBob 2.8s ease-in-out infinite}
.credit .spark{width:24px;height:24px;animation:twinkle 1.8s ease-in-out infinite}
.credit .spark.b{animation-delay:.9s}
@keyframes shine{to{background-position:300% 0}}
@keyframes nameBob{50%{transform:translateY(-6px) rotate(-2deg)}}
@keyframes twinkle{50%{transform:scale(.55) rotate(45deg);opacity:.5}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition:none !important}
  .train,.cloud,.rays,.bfly,.balloon .sway{animation:none !important}
}
</style>
</head>

<header class="scene" id="scene">
  <svg class="sky" id="sky" viewBox="0 0 1000 200" preserveAspectRatio="xMaxYMid slice" aria-label="سماء متحركة: اضغط عليها">
    <defs><linearGradient id="skyg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BFE2F1"/><stop offset="1" stop-color="#EAF6F1"/></linearGradient></defs>
    <rect width="1000" height="200" fill="url(#skyg)"/>

      <g class="rays"><g stroke="#F3C55A" stroke-width="6" stroke-linecap="round"><line x1="0" y1="-48" x2="0" y2="-37"/><line x1="0" y1="37" x2="0" y2="48"/><line x1="-48" y1="0" x2="-37" y2="0"/><line x1="37" y1="0" x2="48" y2="0"/><line x1="-34" y1="-34" x2="-26" y2="-26"/><line x1="26" y1="26" x2="34" y2="34"/><line x1="-34" y1="34" x2="-26" y2="26"/><line x1="26" y1="-26" x2="34" y2="-34"/></g></g>
      <circle r="27" fill="#F8D978"/><circle cx="-9" cy="-4" r="3.2" fill="#2A3F4A"/><circle cx="9" cy="-4" r="3.2" fill="#2A3F4A"/><path d="M-9 7 q9 8 18 0" stroke="#2A3F4A" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
    <g class="cloud c1"><g transform="translate(0 30)" fill="#FFFFFF" opacity=".95"><ellipse cx="40" cy="20" rx="40" ry="17"/><ellipse cx="70" cy="10" rx="30" ry="21"/><ellipse cx="100" cy="21" rx="30" ry="15"/></g></g>
    <g class="cloud c2"><g transform="translate(0 70)" fill="#FFFFFF" opacity=".85"><ellipse cx="30" cy="15" rx="30" ry="12"/><ellipse cx="55" cy="8" rx="24" ry="16"/><ellipse cx="80" cy="16" rx="25" ry="11"/></g></g>
    <g class="bfly"><g transform="scale(.9)"><ellipse class="bwing" cx="-8" cy="0" rx="9" ry="12" fill="#F4A893"/><ellipse class="bwing" cx="8" cy="0" rx="9" ry="12" fill="#C9BCEB"/><rect x="-2" y="-8" width="4" height="18" rx="2" fill="#2A3F4A"/></g></g>
    <path d="M0 160 Q200 120 400 150 T780 140 T1000 135 L1000 200 L0 200Z" fill="#B9E0C6"/>
    <rect x="0" y="171" width="1000" height="5" fill="#8B6A4E"/>
    <g fill="#8B6A4E" opacity=".7"><rect x="20" y="168" width="8" height="10"/><rect x="80" y="168" width="8" height="10"/><rect x="140" y="168" width="8" height="10"/><rect x="200" y="168" width="8" height="10"/><rect x="260" y="168" width="8" height="10"/><rect x="320" y="168" width="8" height="10"/><rect x="380" y="168" width="8" height="10"/><rect x="440" y="168" width="8" height="10"/><rect x="500" y="168" width="8" height="10"/><rect x="560" y="168" width="8" height="10"/><rect x="620" y="168" width="8" height="10"/><rect x="680" y="168" width="8" height="10"/><rect x="740" y="168" width="8" height="10"/><rect x="800" y="168" width="8" height="10"/><rect x="860" y="168" width="8" height="10"/><rect x="920" y="168" width="8" height="10"/><rect x="980" y="168" width="8" height="10"/></g>
    <path d="M0 182 Q260 168 520 184 T1000 176 L1000 200 L0 200Z" fill="#9ED2B6"/>
    <!-- train -->
    <g class="train" id="train">
      <g transform="translate(0 112)">

<script>
(function(){
document.documentElement.lang='ar';document.documentElement.dir='rtl';
const $=s=>document.querySelector(s);
const AR='٠١٢٣٤٥٦٧٨٩';
const ar=v=>String(v).replace(/\d/g,d=>AR[d]);
const WORD={1:'واحد',2:'اثنان',3:'ثلاثة'};
const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

/* ---------- pictures ---------- */
const PIC={
  apple:'<svg viewBox="0 0 60 60" aria-hidden="true"><path d="M30 18 C18 8 4 16 6 32 C8 48 20 56 30 52 C40 56 52 48 54 32 C56 16 42 8 30 18Z" fill="#F08A7A"/><path d="M30 18 Q31 8 36 4" stroke="#8B6A4E" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M33 12 Q44 4 48 12 Q40 18 33 12Z" fill="#7CC39A"/><ellipse cx="19" cy="28" rx="4" ry="7" fill="#FFFFFF" opacity=".45"/></svg>',
  chick:'<svg viewBox="0 0 60 60" aria-hidden="true"><ellipse cx="30" cy="38" rx="20" ry="17" fill="#F8D978"/><circle cx="33" cy="20" r="13" fill="#F8D978"/><circle cx="37" cy="18" r="2.6" fill="#2A3F4A"/><path d="M44 21 L52 23 L44 26Z" fill="#F08A5B"/><ellipse cx="22" cy="38" rx="7" ry="10" fill="#F3C55A"/><path d="M26 54 l-2 4 M34 54 l2 4" stroke="#F08A5B" stroke-width="3" stroke-linecap="round"/></svg>',
  fish:'<svg viewBox="0 0 60 60" aria-hidden="true"><path d="M8 30 C16 16 38 14 46 30 C38 46 16 44 8 30Z" fill="#8DC8E3"/><path d="M44 30 L58 20 L58 40Z" fill="#3C86A6"/><circle cx="18" cy="27" r="3" fill="#2A3F4A"/><path d="M28 22 q4 8 0 16" stroke="#FFFFFF" stroke-width="2" fill="none" opacity=".7"/></svg>',
  flower:'<svg viewBox="0 0 60 60" aria-hidden="true"><path d="M30 34 L30 58" stroke="#3F8F6A" stroke-width="4"/><path d="M30 48 Q40 40 46 46 Q38 52 30 48Z" fill="#7CC39A"/><g fill="#C9BCEB"><circle cx="30" cy="12" r="9"/><circle cx="41" cy="20" r="9"/><circle cx="37" cy="33" r="9"/><circle cx="23" cy="33" r="9"/><circle cx="19" cy="20" r="9"/></g><circle cx="30" cy="23" r="7" fill="#F8D978"/></svg>'
};
const PNAME={apple:'تفاحة',chick:'كتكوت',fish:'سمكة',flower:'زهرة'};
const picRow=(k,kind)=>'<div class="items">'+Array.from({length:k},()=>PIC[kind]).join('')+'</div>';

/* ---------- state ---------- */
const S={name:'',stars:{g1:0,g2:0,g3:0},sound:true};
const KEY='numbers-123-game';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function load(d){
  let o=d&&d.name?d:null;
  if(!o){try{o=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){o=null;}}
  if(o){S.name=o.name||'';Object.assign(S.stars,o.stars||{});S.sound=o.sound!==false;}
}

/* ---------- sound ---------- */
let ctx=null;
const AC=()=>ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
function tone(f,d,type,when){
  if(!S.sound)return;
  try{AC();const t=ctx.currentTime+(when||0),o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+d+.05);}catch(e){}
}
function cheer(){
  if(!S.sound)return;
  try{AC();const t=ctx.currentTime,out=ctx.createGain();out.gain.value=.5;out.connect(ctx.destination);
    const bell=(f,at,len,vol)=>{[[1,1],[2,.25],[3,.08]].forEach(([m,v])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f*m;
      g.gain.setValueAtTime(.0001,t+at);g.gain.exponentialRampToValueAtTime(vol*v,t+at+.012);g.gain.exponentialRampToValueAtTime(.0001,t+at+len);
      o.connect(g).connect(out);o.start(t+at);o.stop(t+at+len+.05);});};
    [523.25,659.25,783.99,1046.5].forEach((f,i)=>bell(f,i*.09,.5,.35));
    bell(1318.5,.38,.9,.3);bell(1046.5,.38,.9,.2);
    [2093,2349,2637,3136,2637,3520].forEach((f,i)=>bell(f,.5+i*.06,.25,.07));
  }catch(e){}
}
const sfx={
  good(){cheer();},
  bad(){tone(150,.16,'square');tone(110,.34,'square',.2);},
  pop(){tone(880,.08,'square');tone(1320,.06,'square',.04);},
  flip(){tone(600,.07,'sine');},
  toot(){tone(392,.25,'triangle');tone(392,.35,'triangle',.3);},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',i*.14));}
};
function speak(text){try{if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ar-SA';u.rate=.8;speechSynthesis.speak(u);}catch(e){}}
const canSpeak='speechSynthesis' in window;
function speakBtn(text){
  if(!canSpeak)return'';
  return '<button class="speak" type="button" data-say="'+text+'" aria-label="استمع"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4Z" fill="#2A3F4A"/><path d="M16 8a5 5 0 0 1 0 8" stroke="#2A3F4A" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button>';
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b)speak(b.dataset.say);});

/* ---------- UI helpers ---------- */
const STAR='<svg viewBox="0 0 24 24"><path d="M12 2l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.8 5.7 21.4l1.5-7.1L1.8 9.4 9 8.6Z" fill="FILL" stroke="STROKE" stroke-width="1.2"/></svg>';
const starRow=n=>[1,2,3].map(i=>STAR.replace('FILL',i<=n?'#F3C55A':'#E4ECE9').replace('STROKE',i<=n?'#B88A1C':'#C9D6D2')).join('');
function refreshStars(){
  document.querySelectorAll('[data-stars]').forEach(el=>{el.innerHTML=starRow(S.stars[el.dataset.stars]);});
  const tot=S.stars.g1+S.stars.g2+S.stars.g3,done=S.stars.g1&&S.stars.g2&&S.stars.g3;
  $('#cert').hidden=!done;
  if(done){$('#certName').textContent=S.name;$('#certText').textContent='أنهيت الألعاب الثلاث وجمعت '+ar(tot)+' نجوم من '+ar(9)+'. أنت تعرف الأعداد ١ و٢ و٣!';}
}
let bubbleTimer=0;
function say(msg,ms){const b=$('#bubble');b.textContent=msg;b.hidden=false;b.style.animation='none';void b.offsetWidth;b.style.animation='';clearTimeout(bubbleTimer);bubbleTimer=setTimeout(()=>{b.hidden=true;},ms||3200);}
const nm=()=>S.name||'يا بطل';
const PRAISE=[n=>'رائع يا '+n+'!',n=>'إجابة صحيحة يا '+n+'!',n=>'ممتاز يا '+n+'!',n=>'برافو يا '+n+'!',n=>'أنت بطل يا '+n+'!'];
const TRY=[n=>'لنحاول مرة أخرى يا '+n+'.',n=>'عُدّ بإصبعك يا '+n+': واحد، اثنان، ثلاثة.',n=>'فكّر قليلاً يا '+n+'، أنت تستطيع!'];
const pick=a=>a[Math.floor(Math.random()*a.length)](nm());
function show(id){['welcome','menu','g1','g2','g3'].forEach(s=>{$('#sc-'+s).hidden=(s!==id);});window.scrollTo({top:0,behavior:'smooth'});}
function progress(g,i,n){$('#'+g+'-count').textContent='السؤال '+ar(Math.min(i+1,n))+' من '+ar(n);$('#'+g+'-bar').style.width=(i/n*100)+'%';}

const cv=$('#confetti'),cx=cv.getContext('2d');let parts=[],raf=0;
function confetti(n){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  cv.width=innerWidth;cv.height=innerHeight;const cols=['#F4A893','#A6D8BD','#F8E09A','#C9BCEB','#AFDAEC'];
  for(let i=0;i<(n||70);i++)parts.push({x:innerWidth/2+rand(-120,120),y:innerHeight*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*11-3,s:rand(6,12),c:cols[i%5],r:Math.random()*6,life:110});
  if(!raf)loop();
}
function loop(){cx.clearRect(0,0,cv.width,cv.height);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.r+=.2;p.life--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore();});
  parts=parts.filter(p=>p.life>0&&p.y<cv.height+20);raf=parts.length?requestAnimationFrame(loop):(cx.clearRect(0,0,cv.width,cv.height),0);}

/* ---------- sky ---------- */
$('#chick').addEventListener('click',e=>{
  e.stopPropagation();const c=$('#chick');c.classList.remove('hop');void c.getBoundingClientRect();c.classList.add('hop');sfx.pop();
  const tips=['مرحباً يا '+nm()+'! هيا نعدّ: واحد، اثنان، ثلاثة.','الرقم ١ نكتبه بخط واحد من الأعلى إلى الأسفل.','عندي جناحان: واحد، اثنان. إذن عندي ٢!','٣ أكثر من ٢، و٢ أكثر من ١.','اضغط على القطار يا '+nm()+'!'];
  say(tips[rand(0,tips.length-1)],4200);
});
$('#train').addEventListener('click',e=>{e.stopPropagation();const t=$('#train');sfx.toot();say('توت توت! في القطار عربات: ١ و٢ و٣.',3000);});
$('#sky').addEventListener('click',e=>{
  const sc=$('#scene').getBoundingClientRect(),n=rand(1,3),el=document.createElement('span');
  el.className='sky-pop';el.innerHTML=AR[n]+' '+'<i></i>'.repeat(n);
  el.style.left=Math.min(Math.max(e.clientX-sc.left-40,4),sc.width-120)+'px';el.style.top=Math.max(e.clientY-sc.top-20,4)+'px';
  $('#scene').appendChild(el);sfx.pop();setTimeout(()=>el.remove(),2200);
});
$('#soundBtn').addEventListener('click',()=>{S.sound=!S.sound;save();$('#soundBtn').setAttribute('aria-pressed',S.sound);$('#soundIcon').style.opacity=S.sound?1:.35;if(S.sound)sfx.flip();});

/* ---------- welcome / menu ---------- */
$('#nameForm').addEventListener('submit',e=>{
  e.preventDefault();const v=$('#kidName').value.trim();

/* ---------- results (optional Google Sheets) ---------- */
const RESULTS_URL='';
const GAME_NAMES={g1:'عد وفرقع (١-٣)',g2:'البطاقات القلابة (١-٣)',g3:'السلة والقلم (١-٣)'};
function sendResult(g,stars,miss){
  if(!RESULTS_URL)return;
  try{fetch(RESULTS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({name:S.name,game:GAME_NAMES[g],stars:stars,mistakes:miss})}).catch(()=>{});}catch(e){}
}
let after=null;
function finish(g,stars,miss){
  sendResult(g,stars,miss);
  S.stars[g]=Math.max(S.stars[g],stars);save();refreshStars();
  $('#resStars').innerHTML=starRow(stars);
  $('#resTitle').textContent=stars===3?'مذهل يا '+nm()+'!':stars===2?'عمل رائع يا '+nm()+'!':'أحسنت المحاولة يا '+nm()+'!';
  $('#resText').textContent=stars===3?'حصلت على ثلاث نجوم كاملة.':'حصلت على '+ar(stars)+' '+(stars===1?'نجمة':'نجمتين')+'. العب مرة أخرى لتجمع ثلاث نجوم!';
  const next={g1:'g2',g2:'g3',g3:null}[g];$('#resNext').textContent=next?'اللعبة التالية':'العودة إلى القائمة';after={g,next};
  $('#overlay').hidden=false;sfx.win();confetti(140);$('#resNext').focus();
}
$('#resAgain').addEventListener('click',()=>{$('#overlay').hidden=true;start(after.g);});
$('#resNext').addEventListener('click',()=>{$('#overlay').hidden=true;if(after.next)start(after.next);else{stopAll();goMenu();}});

/* ================= GAME 1: count & pop ================= */
const G1={rounds:[],i:0,miss:0,lock:false};
const BCOL=[['#F4A893','#C9604A'],['#A6D8BD','#3F8F6A'],['#C9BCEB','#6E5BAE'],['#F8E09A','#B88A1C'],['#AFDAEC','#3C86A6']];
function startG1(){
  const kinds=shuffle(Object.keys(PIC));
  const counts=shuffle([1,2,3,1,2,3]);
  G1.rounds=counts.map((n,i)=>({type:i===2||i===5?'word':'count',n,kind:kinds[i%kinds.length]}));
  G1.i=0;G1.miss=0;show('g1');renderG1();
  say('عُدّ الصور يا '+nm()+' ثم اضغط على البالون الذي يحمل العدد.',3800);
}
function renderG1(){
  const r=G1.rounds[G1.i];G1.lock=false;progress('g1',G1.i,G1.rounds.length);
  const p=$('#g1-prompt');
  if(r.type==='count')p.innerHTML='<p class="q">كم '+(r.kind==='apple'?'تفاحة':r.kind==='chick'?'كتكوتاً':r.kind==='fish'?'سمكة':'زهرة')+' ترى؟ عُدّ ثم اضغط على البالون الصحيح.</p>'+picRow(r.n,r.kind);
  else p.innerHTML='<p class="q">اضغط على البالون الذي يحمل هذا العدد:</p><span class="word">'+WORD[r.n]+'</span>'+speakBtn(WORD[r.n]);
  const sky=$('#g1-sky');sky.innerHTML='';
  shuffle([1,2,3]).forEach((v,idx)=>{
    const [c,d]=BCOL[(G1.i+idx)%BCOL.length];
    const b=document.createElement('button');b.type='button';b.className='balloon';b.setAttribute('aria-label','بالون العدد '+AR[v]);
    b.innerHTML='<span class="sway" style="animation-delay:-'+(idx*.8)+'s"><svg viewBox="0 0 100 160"><path d="M50 4 C82 4 96 30 96 56 C96 88 70 108 54 114 L46 114 C30 108 4 88 4 56 C4 30 18 4 50 4Z" fill="'+c+'" stroke="'+d+'" stroke-width="3"/><ellipse cx="30" cy="34" rx="9" ry="15" fill="#FFFFFF" opacity=".5"/><path d="M44 114 L56 114 L50 122Z" fill="'+d+'"/><path d="M50 122 q-8 12 0 22 q8 10 0 16" stroke="#60777E" stroke-width="2" fill="none"/></svg><span class="num">'+AR[v]+'</span></span>';
    b.addEventListener('click',()=>pickG1(b,v));sky.appendChild(b);
  });
}
function pickG1(b,v){
  if(G1.lock)return;const r=G1.rounds[G1.i];
  if(v===r.n){
    G1.lock=true;b.classList.add('popped');sfx.pop();setTimeout(sfx.good,120);confetti(50);
    say(pick(PRAISE)+' '+AR[r.n]+' = '+WORD[r.n],2600);
    setTimeout(()=>{G1.i++;if(G1.i<G1.rounds.length)renderG1();else{progress('g1',G1.i,G1.rounds.length);finish('g1',G1.miss<=1?3:G1.miss<=3?2:1,G1.miss);}},1500);
  }else{
    G1.miss++;sfx.bad();b.classList.add('wrong');say(pick(TRY));
    setTimeout(()=>{b.classList.remove('wrong');b.classList.add('faded');},500);
  }
}

/* ================= GAME 2: flip-card pairs (2 easy levels) ================= */
const G2={level:0,open:[],matched:0,miss:0,lock:false,kind:'apple'};
const G2L=[{k:'p',hint:'المرحلة الأولى: طابق كل رقم مع الصورة التي فيها العدد نفسه.'},{k:'w',hint:'المرحلة الثانية: طابق كل رقم مع كلمته.'}];
function startG2(){
  Object.assign(G2,{level:0,miss:0});G2.kind=shuffle(['apple','chick','fish','flower'])[0];
  show('g2');buildG2();
}
function buildG2(){
  Object.assign(G2,{open:[],matched:0,lock:true});
  const L=G2L[G2.level];$('#g2-hint').textContent=L.hint;
  document.querySelectorAll('#g2-found span').forEach(s=>s.classList.remove('on'));
  const cards=[];[1,2,3].forEach(v=>{cards.push({v,k:'n'});cards.push({v,k:L.k});});
  const grid=$('#g2-grid');grid.innerHTML='';
  shuffle(cards).forEach(c=>{
    const b=document.createElement('button');b.type='button';b.className='fcard open';
    const front=c.k==='n'?'<span class="val">'+AR[c.v]+'</span>':c.k==='w'?'<span class="wd">'+WORD[c.v]+'</span>':'<span class="pics">'+Array.from({length:c.v},()=>PIC[G2.kind]).join('')+'</span>';
    b.innerHTML='<span class="in"><span class="face back"><svg viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="26" fill="#FFFFFF" opacity=".75"/><text x="30" y="42" text-anchor="middle" font-size="34" font-weight="800" fill="#B88A1C" font-family="Baloo Bhaijaan 2, sans-serif">؟</text></svg></span><span class="face front '+c.k+'">'+front+'</span></span>';
    b._c=c;b.setAttribute('aria-label',c.k==='n'?AR[c.v]:c.k==='w'?WORD[c.v]:AR[c.v]+' صور');
    b.addEventListener('click',()=>flipG2(b));grid.appendChild(b);
  });
  updG2();
  say((G2.level?'أحسنت يا '+nm()+'! ':'')+'انظر جيداً إلى البطاقات، ستنقلب بعد قليل.',3000);
  setTimeout(()=>{document.querySelectorAll('#g2-grid .fcard').forEach(b=>{b.classList.remove('open');b.setAttribute('aria-label','بطاقة مقلوبة');});G2.lock=false;},3500);
}
function updG2(){$('#g2-count').textContent='المرحلة '+ar(G2.level+1)+' من '+ar(2)+' · الأزواج '+ar(G2.matched)+' من '+ar(3);$('#g2-bar').style.width=((G2.level*3+G2.matched)/6*100)+'%';}
function flipG2(b){
  if(G2.lock||b.classList.contains('open')||b.classList.contains('done'))return;
  sfx.flip();b.classList.add('open');const c=b._c;b.setAttribute('aria-label',c.k==='n'?AR[c.v]:c.k==='w'?WORD[c.v]:AR[c.v]+' صور');
  G2.open.push(b);if(G2.open.length<2)return;
  const [a,d]=G2.open;G2.lock=true;
  if(a._c.v===d._c.v){
    setTimeout(()=>{[a,d].forEach(x=>{x.classList.remove('open');x.classList.add('done');});
      G2.matched++;updG2();document.querySelectorAll('#g2-found span')[a._c.v-1].classList.add('on');
      sfx.good();confetti(50);say(pick(PRAISE)+' '+AR[a._c.v]+' = '+WORD[a._c.v],2600);G2.open=[];G2.lock=false;
      if(G2.matched===3){G2.lock=true;
        if(G2.level===0)setTimeout(()=>{G2.level=1;buildG2();},1600);
        else setTimeout(()=>finish('g2',G2.miss<=2?3:G2.miss<=5?2:1,G2.miss),1000);}
    },450);
  }else{
    G2.miss++;
    setTimeout(()=>{a.classList.add('bad');d.classList.add('bad');sfx.bad();say(pick(TRY));},450);
    setTimeout(()=>{[a,d].forEach(x=>{x.classList.remove('open','bad');x.setAttribute('aria-label','بطاقة مقلوبة');});G2.open=[];G2.lock=false;},1400);
  }
}

/* ================= GAME 3: basket & pencil ================= */
const G3={rounds:[],i:0,miss:0,lock:false,inBasket:0};
function startG3(){
  const a=shuffle([1,2,3]),b=shuffle([1,2,3]);
  G3.rounds=[{type:'basket',n:a[0],show:'num'},{type:'trace',n:1},{type:'basket',n:a[1],show:'word'},{type:'trace',n:2},{type:'basket',n:a[2],show:'num'},{type:'trace',n:3}];
  G3.i=0;G3.miss=0;show('g3');renderG3();
  say('اسحب التفاح إلى السلة يا '+nm()+'، أو اضغط عليه.',3800);
}
function renderG3(){
  const r=G3.rounds[G3.i];G3.lock=false;progress('g3',G3.i,G3.rounds.length);
  const p=$('#g3-prompt'),area=$('#g3-area');
  if(r.type==='basket'){
    G3.inBasket=0;
    p.innerHTML='<p class="q">ضع في السلة من التفاح بهذا العدد:</p>'+(r.show==='num'?'<span class="big">'+AR[r.n]+'</span>':'<span class="word">'+WORD[r.n]+'</span>'+speakBtn(WORD[r.n]));
    area.innerHTML='<div class="orchard"><div class="tree"><div class="apples" id="tree"></div></div>'+
      '<div class="basket" data-drop="basket" id="basket"><div class="inside" id="inside"></div>'+
      '<svg class="weave" viewBox="0 0 220 70" aria-hidden="true"><path d="M10 6 h200 l-18 60 h-164Z" fill="#E7B66A"/><path d="M4 6 h212" stroke="#B88A1C" stroke-width="8" stroke-linecap="round"/><g stroke="#C9963E" stroke-width="3"><path d="M30 20 h160 M36 38 h148 M42 54 h136"/></g></svg><span class="label">السلة</span></div></div>'+
      '<p class="hint">اضغط على تفاحة داخل السلة لإعادتها إلى الشجرة.</p>'+
      '<div class="actions"><button class="btn" id="g3check" type="button">تحقّق من السلة</button></div>';

    p.innerHTML='<p class="q">اكتب الرقم بإصبعك فوق الخط، وابدأ من النقطة الخضراء:</p><span class="big">'+AR[r.n]+'</span><span class="word" style="font-size:28px">'+WORD[r.n]+'</span>'+speakBtn(WORD[r.n]);
    area.innerHTML='<div class="trace-wrap"><div class="board" id="board"><canvas id="cvGuide"></canvas><canvas id="cvDraw"></canvas></div>'+
      '<div class="actions" style="margin-top:4px"><button class="btn soft" id="tDemo" type="button">شاهد كيف أكتبه</button><button class="btn alt" id="tClear" type="button">امسح</button><button class="btn" id="tCheck" type="button">تحقّق</button></div></div>';
    setupTrace(r.n);
  }
}
function drawTree(){
  const tree=$('#tree'),inside=$('#inside');const left=5-G3.inBasket;
  tree.innerHTML='';for(let i=0;i<left;i++){const f=document.createElement('button');f.type='button';f.className='fruit';f.setAttribute('aria-label','تفاحة');f.innerHTML=PIC.apple;
    dragify(f,()=>addApple(),(tgt)=>{if(tgt.dataset.drop==='basket')addApple();});tree.appendChild(f);}
  inside.innerHTML='';for(let i=0;i<G3.inBasket;i++){const f=document.createElement('button');f.type='button';f.setAttribute('aria-label','أعد التفاحة');f.innerHTML=PIC.apple;f.addEventListener('click',()=>{if(G3.lock)return;G3.inBasket--;sfx.flip();drawTree();});inside.appendChild(f);}
}
function addApple(){if(G3.lock||G3.inBasket>=5)return;G3.inBasket++;sfx.pop();drawTree();}
function checkBasket(){
  if(G3.lock)return;
  const r=G3.rounds[G3.i];
  if(G3.inBasket===r.n){G3.lock=true;sfx.good();confetti(60);say(pick(PRAISE)+' في السلة '+AR[r.n]+' = '+WORD[r.n],2800);goNext(1800);}
  else{G3.miss++;sfx.bad();say(G3.inBasket<r.n?'نحتاج تفاحاً أكثر يا '+nm()+'. عُدّ مرة أخرى.':'في السلة تفاح أكثر من المطلوب يا '+nm()+'. أخرج بعضه.',3200);}
}
function goNext(ms){const at=G3.i;setTimeout(()=>{if(G3.i===at&&!$('#sc-g3').hidden)nextG3();},ms);}
function nextG3(){G3.i++;if(G3.i<G3.rounds.length)renderG3();else{progress('g3',G3.i,G3.rounds.length);finish('g3',G3.miss<=1?3:G3.miss<=3?2:1,G3.miss);}}

/* ---- tracing ---- */
const TW=260,TH=300;
let T=null;
function glyphCanvas(n,extra){
  const c=document.createElement('canvas');c.width=TW;c.height=TH;const g=c.getContext('2d');
  g.font='800 230px "Baloo Bhaijaan 2","Tajawal",sans-serif';g.textAlign='center';g.textBaseline='alphabetic';
  const m=g.measureText(AR[n]);const asc=m.actualBoundingBoxAscent||170,desc=m.actualBoundingBoxDescent||0;
  const y=TH/2+(asc-desc)/2;
  g.fillStyle='#000';g.fillText(AR[n],TW/2,y);
  if(extra){g.lineWidth=extra;g.lineJoin='round';g.strokeStyle='#000';g.strokeText(AR[n],TW/2,y);}
  return {c,y};
}
async function setupTrace(n){
  try{await document.fonts.load('800 230px "Baloo Bhaijaan 2"',AR[n]);}catch(e){}
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const guide=$('#cvGuide'),draw=$('#cvDraw');if(!guide)return;
  [guide,draw].forEach(cn=>{cn.width=TW*dpr;cn.height=TH*dpr;cn.getContext('2d').setTransform(dpr,0,0,dpr,0,0);});
  const core=glyphCanvas(n,0),zone=glyphCanvas(n,40);
  const coreData=core.c.getContext('2d').getImageData(0,0,TW,TH).data,zoneData=zone.c.getContext('2d').getImageData(0,0,TW,TH).data;
  const segs=strokePath(coreData,n);
  let sx=TW/2,sy=40;
  if(segs.length&&segs[0].length){[sx,sy]=segs[0][0];}
  else{outer:for(let y=0;y<TH;y++){for(let x=0;x<TW;x++){if(coreData[(y*TW+x)*4+3]>128){sx=x;sy=y;break outer;}}}}
  T={n,coreData,zoneData,strokes:[],cur:null,sx,sy,core,segs,demo:0};
  paintGuide(false);
  const toXY=e=>{const r=draw.getBoundingClientRect();return [(e.clientX-r.left)/r.width*TW,(e.clientY-r.top)/r.height*TH];};
  draw.addEventListener('pointerdown',e=>{if(G3.lock)return;e.preventDefault();draw.setPointerCapture(e.pointerId);T.cur=[toXY(e)];T.strokes.push(T.cur);paintDraw();});
  draw.addEventListener('pointermove',e=>{if(!T.cur)return;e.preventDefault();T.cur.push(toXY(e));paintDraw();});
  const end=()=>{T.cur=null;};draw.addEventListener('pointerup',end);draw.addEventListener('pointercancel',end);
  $('#tClear').addEventListener('click',()=>{T.strokes=[];paintDraw();});
  $('#tCheck').addEventListener('click',checkTrace);
  $('#tDemo').addEventListener('click',demoTrace);
}
function paintGuide(done){
  const g=$('#cvGuide').getContext('2d');g.clearRect(0,0,TW,TH);
  g.save();g.globalAlpha=done?1:.32;g.drawImage(T.core.c,0,0);g.globalCompositeOperation='source-in';g.fillStyle=done?'#A6D8BD':'#FFFFFF';g.fillRect(0,0,TW,TH);g.restore();
  if(!done){g.fillStyle='#7CE0A0';g.beginPath();g.arc(T.sx,T.sy,11,0,7);g.fill();g.fillStyle='#2F5D50';g.font='800 14px sans-serif';g.textAlign='center';g.fillText('▼',T.sx,T.sy+5);}
}
function paintDraw(){
  const g=$('#cvDraw').getContext('2d');g.clearRect(0,0,TW,TH);
  g.strokeStyle='#F8E09A';g.lineWidth=20;g.lineCap='round';g.lineJoin='round';
  T.strokes.forEach(s=>{g.beginPath();s.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));if(s.length===1)g.lineTo(s[0][0]+.1,s[0][1]);g.stroke();});
}
function checkTrace(){
  if(G3.lock)return;
  if(!T.strokes.length){say('اكتب الرقم أولاً يا '+nm()+'، ابدأ من النقطة الخضراء.',3000);return;}
  const c=document.createElement('canvas');c.width=TW;c.height=TH;const g=c.getContext('2d');
  g.strokeStyle='#000';g.lineWidth=26;g.lineCap='round';g.lineJoin='round';
  T.strokes.forEach(s=>{g.beginPath();s.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));if(s.length===1)g.lineTo(s[0][0]+.1,s[0][1]);g.stroke();});
  const u=g.getImageData(0,0,TW,TH).data;let core=0,hit=0,user=0,out=0;
  for(let i=3;i<u.length;i+=4){const inCore=T.coreData[i]>128,inUser=u[i]>128;if(inCore){core++;if(inUser)hit++;}if(inUser){user++;if(T.zoneData[i]<=128)out++;}}
  const cover=core?hit/core:0,outside=user?out/user:1;
  if(cover>=.6&&outside<=.35){G3.lock=true;paintGuide(true);sfx.good();confetti(60);say(pick(PRAISE)+' كتبت '+AR[T.n]+' بشكل صحيح.',2800);goNext(1900);}
  else{G3.miss++;sfx.bad();say(cover<.6?'اكتب فوق الخط كله يا '+nm()+'، من الأعلى إلى الأسفل.':'حاول أن تبقى على الخط يا '+nm()+'.',3200);setTimeout(()=>{T.strokes=[];paintDraw();},700);}
}
/* centre line of the digit (thinning), ordered from the top-right start like handwriting */
function strokePath(coreData,digit){
  if(digit===1){const seg=[];for(let y=0;y<TH;y+=5){let sx=0,c=0;for(let x=0;x<TW;x++)if(coreData[(y*TW+x)*4+3]>128){sx+=x;c++;}if(c)seg.push([sx/c,y+2]);}return seg.length?[seg]:[];}
  const K=2,w=Math.floor(TW/K),h=Math.floor(TH/K),m=new Uint8Array(w*h),I=(x,y)=>y*w+x;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){let on=0;for(let dy=0;dy<K;dy++)for(let dx=0;dx<K;dx++)if(coreData[((y*K+dy)*TW+(x*K+dx))*4+3]>128)on++;m[I(x,y)]=on>=2?1:0;}
  let changed=true,guard=0;
  while(changed&&guard++<80){changed=false;
    for(let pass=0;pass<2;pass++){const del=[];
      for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){if(!m[I(x,y)])continue;
        const p2=m[I(x,y-1)],p3=m[I(x+1,y-1)],p4=m[I(x+1,y)],p5=m[I(x+1,y+1)],p6=m[I(x,y+1)],p7=m[I(x-1,y+1)],p8=m[I(x-1,y)],p9=m[I(x-1,y-1)];
        const B=p2+p3+p4+p5+p6+p7+p8+p9;if(B<2||B>6)continue;
        const q=[p2,p3,p4,p5,p6,p7,p8,p9,p2];let A=0;for(let k=0;k<8;k++)if(!q[k]&&q[k+1])A++;if(A!==1)continue;
        if(pass===0){if(p2&&p4&&p6)continue;if(p4&&p6&&p8)continue;}else{if(p2&&p4&&p8)continue;if(p2&&p6&&p8)continue;}
        del.push(I(x,y));}
      if(del.length){changed=true;del.forEach(i=>m[i]=0);}}}
  const nb=(x,y)=>{const r=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const X=x+dx,Y=y+dy;if(X>=0&&Y>=0&&X<w&&Y<h&&m[I(X,Y)])r.push([X,Y]);}return r;};
  // prune short spurs
  for(let round=0;round<2;round++){
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(!m[I(x,y)]||nb(x,y).length!==1)continue;
      const walk=[[x,y]];let cx=x,cy=y,px=-1,py=-1;
      while(walk.length<8){const n=nb(cx,cy).filter(([X,Y])=>!(X===px&&Y===py)&&!walk.some(([a,b])=>a===X&&b===Y));if(n.length!==1)break;px=cx;py=cy;[cx,cy]=n[0];if(nb(cx,cy).length>2)break;walk.push([cx,cy]);}
      if(walk.length<8&&nb(cx,cy).length>2)walk.forEach(([a,b])=>{m[I(a,b)]=0;});}}
  const pts=[];for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(m[I(x,y)])pts.push([x,y]);
  if(!pts.length)return[];
  let minY=1e9,maxY=-1;pts.forEach(([,y])=>{minY=Math.min(minY,y);maxY=Math.max(maxY,y);});
  const top=pts.filter(([,y])=>y<=minY+.4*(maxY-minY));let start=top[0];top.forEach(p=>{if(p[0]-p[1]*.3>start[0]-start[1]*.3)start=p;});
  const seen=new Set(),key=(x,y)=>y*w+x,segs=[];let cur=start,seg=[cur],dir=null;seen.add(key(...cur));
  while(true){
    let n=nb(...cur).filter(([X,Y])=>!seen.has(key(X,Y)));
    if(n.length>1){
      // a short dead-end branch (like a tooth of ٣): draw it and come back
      for(const c of n){
        const br=[c],tmp=new Set([key(...cur),key(...c)]);let p=c,dead=false;
        while(br.length<=22){const nn=nb(...p).filter(([X,Y])=>!seen.has(key(X,Y))&&!tmp.has(key(X,Y)));if(!nn.length){dead=true;break;}if(nn.length>1)break;p=nn[0];tmp.add(key(...p));br.push(p);}
        if(dead&&br.length>=3&&br.length<=22){br.forEach(q=>{seen.add(key(...q));seg.push(q);});br.slice(0,-1).reverse().forEach(q=>seg.push(q));seg.push(cur);}
      }
      n=nb(...cur).filter(([X,Y])=>!seen.has(key(X,Y)));
    }
    if(n.length){
      if(dir){const sc=a=>Math.hypot(a[0]-cur[0]-dir[0],a[1]-cur[1]-dir[1])-.6*(a[1]-cur[1]);n.sort((a,b)=>sc(a)-sc(b));}
      const nx=n[0];dir=[nx[0]-cur[0],nx[1]-cur[1]];cur=nx;seen.add(key(...cur));seg.push(cur);continue;}
    segs.push(seg);
    const left=pts.filter(([x,y])=>!seen.has(key(x,y)));if(!left.length)break;
    let best=null,bd=1e9;left.forEach(p=>{const d=Math.hypot(p[0]-cur[0],p[1]-cur[1]);if(d<bd){bd=d;best=p;}});
    if(left.length<4)break;
    cur=best;seen.add(key(...cur));seg=[cur];dir=null;
  }
  return segs.slice(0,1).filter(sg=>sg.length>3).map(sg=>sg.filter((p,i)=>i%2===0||i===sg.length-1).map(([x,y])=>[x*K+K/2,y*K+K/2]));
}
function demoTrace(){
  if(!T||!T.segs||!T.segs.length)return;
  const run=++T.demo,g=$('#cvGuide').getContext('2d');
  const lens=T.segs.map(sg=>{let L=0;for(let i=1;i<sg.length;i++)L+=Math.hypot(sg[i][0]-sg[i-1][0],sg[i][1]-sg[i-1][1]);return L;});
  const total=lens.reduce((a,b)=>a+b,0)||1,dur=Math.max(1800,total*9);let t0=null;
  const step=ts=>{
    if(run!==T.demo||!$('#cvGuide'))return;
    if(!t0)t0=ts;let rem=Math.min((ts-t0)/dur,1)*total;paintGuide(false);
    g.save();g.strokeStyle='#F8E09A';g.lineWidth=18;g.lineCap='round';g.lineJoin='round';let pen=null;
    for(let s=0;s<T.segs.length&&rem>0;s++){const sg=T.segs[s];g.beginPath();g.moveTo(sg[0][0],sg[0][1]);pen=sg[0];
      for(let i=1;i<sg.length;i++){const d=Math.hypot(sg[i][0]-sg[i-1][0],sg[i][1]-sg[i-1][1]);
        if(rem>=d){g.lineTo(sg[i][0],sg[i][1]);rem-=d;pen=sg[i];}
        else{const f=rem/d,px=sg[i-1][0]+(sg[i][0]-sg[i-1][0])*f,py=sg[i-1][1]+(sg[i][1]-sg[i-1][1])*f;g.lineTo(px,py);pen=[px,py];rem=0;break;}}
      g.stroke();}
    if(pen){g.fillStyle='#F4A893';g.strokeStyle='#FFFFFF';g.lineWidth=3;g.beginPath();g.arc(pen[0],pen[1],12,0,7);g.fill();g.stroke();
      g.fillStyle='#2A3F4A';g.beginPath();g.moveTo(pen[0]+6,pen[1]-6);g.lineTo(pen[0]+30,pen[1]-30);g.lineTo(pen[0]+36,pen[1]-24);g.lineTo(pen[0]+12,pen[1]);g.closePath();g.fill();}
    g.restore();
    if((ts-t0)<dur)requestAnimationFrame(step);else setTimeout(()=>{if(run===T.demo)paintGuide(false);},1000);
  };
  requestAnimationFrame(step);
}

/* ---- drag (mouse + touch) with tap fallback ---- */
function dragify(el,onTap,onDrop){
  el.addEventListener('click',()=>{if(el._dragged){el._dragged=false;return;}onTap();});
  el.addEventListener('pointerdown',e=>{
    if(e.button>0||G3.lock)return;const sx=e.clientX,sy=e.clientY;let ghost=null,over=null;
    const move=ev=>{
      if(!ghost&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>8){const r=el.getBoundingClientRect();ghost=el.cloneNode(true);ghost.classList.add('ghost');ghost.style.width=r.width+'px';ghost.style.height=r.height+'px';document.body.appendChild(ghost);}
      if(!ghost)return;ev.preventDefault();
      ghost.style.left=(ev.clientX-ghost.offsetWidth/2)+'px';ghost.style.top=(ev.clientY-ghost.offsetHeight/2)+'px';
      const t=document.elementFromPoint(ev.clientX,ev.clientY);const tgt=t&&t.closest('[data-drop]');
      if(over&&over!==tgt)over.classList.remove('over');if(tgt)tgt.classList.add('over');over=tgt;
    };
    const end=ev=>{
      window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',end);window.removeEventListener('pointercancel',end);
      if(over)over.classList.remove('over');if(!ghost)return;
      ghost.remove();el._dragged=true;setTimeout(()=>{el._dragged=false;},50);if(ev.type==='pointercancel')return;
      const t=document.elementFromPoint(ev.clientX,ev.clientY);const tgt=t&&t.closest('[data-drop]');if(tgt)onDrop(tgt);
    };
    window.addEventListener('pointermove',move,{passive:false});window.addEventListener('pointerup',end);window.addEventListener('pointercancel',end);
  });
}

/* ---------- boot ---------- */
function boot(data){
  load(data);$('#soundBtn').setAttribute('aria-pressed',S.sound);$('#soundIcon').style.opacity=S.sound?1:.35;refreshStars();
  if(S.name){$('#kidName').value=S.name;goMenu(false);say('أهلاً بعودتك يا '+S.name+'!',3000);}
  else{show('welcome');setTimeout(()=>say('مرحباً! اكتب اسمك لنبدأ اللعب.',4000),600);}
}
try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({name:S.name,stars:S.stars,sound:S.sound}));}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(boot);
else boot((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
})();
